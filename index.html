    <!-- Preloader: painted before the JavaScript bundle arrives; removed by src/lib/preloader.js -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        animation: rn-pl-failsafe 0.5s ease 4s forwards;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #preloader .rn-pl {
        position: relative;
        width: 116px;
        height: 116px;
        display: grid;
        place-items: center;
      }
      #preloader .rn-pl::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(35, 71, 191, 0.14);
        border-top-color: #2347bf;
        border-right-color: #e9c311;
        animation: rn-pl-spin 0.9s linear infinite;
      }
      #preloader img {
        width: 78px;
        height: auto;
      }
      @keyframes rn-pl-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes rn-pl-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .rn-pl::before {
          animation: none;
        }
      }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
